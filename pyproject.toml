[project]
name = "onboardkit"
version = "0.1.0"
description = "Toolkit for onboarding an advisor firm's messy exports into one clean, reconciled data model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "typer",
    "faker",
    "openpyxl",
]

[project.scripts]
onboardkit-gen = "onboardkit.datagen.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboardkit"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Story documents contain illustrative code sketches; do not lint or format them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take a long time (default-size datasets, cross-process runs)",
]

[tool.coverage.run]
source = ["onboardkit"]

[tool.coverage.report]
# Never lower this silently; raise it deliberately. Documented in docs/testing.md.
fail_under = 85

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
